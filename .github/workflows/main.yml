name: CI
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-node@v1
      with:
        node-version: 20.x
    - run: npm i
    # includes the hard-coded UI string rules
    - run: npm run lint
    - run: |
        echo ">>> Start compile vscode-office."
        npm run build
        echo ">>> Compile vscode-office sucess!"
  i18n:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
    # fails on errors; the coverage table and the warnings go to the job summary
    - run: node scripts/i18n-check.mjs --verbose --summary "$GITHUB_STEP_SUMMARY"
